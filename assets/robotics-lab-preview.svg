<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="t d"><title id="t">Interactive 3D Robotics Lab preview</title><desc id="d">Isometric autonomous mobile robot and quadcopter. Open the link to rotate the real-time 3D models.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111d35"/></linearGradient><linearGradient id="cyan" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#67e8f9" stroke-opacity=".09"/></pattern></defs><rect width="1100" height="250" rx="22" fill="url(#bg)"/><rect width="1100" height="250" rx="22" fill="url(#g)"/><text x="48" y="65" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="26" font-weight="700">Interactive 3D Robotics Lab</text><text x="50" y="97" fill="#94a3b8" font-family="Inter,Segoe UI,Arial" font-size="15">Drag to orbit · Scroll to zoom · Switch between robot models</text><g transform="translate(70 113)"><path d="M0 47 89 4l90 43-90 48Z" fill="#164e63" stroke="#67e8f9"/><path d="M0 47v40l89 45V92Z" fill="#0b2639" stroke="#155e75"/><path d="M179 47v40l-90 45V92Z" fill="#0e7490" stroke="#22d3ee"/><path d="m43 47 46-23 47 23-47 24Z" fill="#111d35" stroke="#a5f3fc"/><path d="M89 24V-2" stroke="#bae6fd" stroke-width="5"/><ellipse cx="89" cy="-4" rx="19" ry="7" fill="#172554" stroke="#22d3ee"/><g fill="#07111f" stroke="#67e8f9" stroke-width="2"><ellipse cx="12" cy="97" rx="8" ry="16"/><ellipse cx="75" cy="128" rx="8" ry="16"/><ellipse cx="166" cy="96" rx="8" ry="16"/></g></g><g transform="translate(370 141)" stroke="#67e8f9" stroke-width="3" fill="none"><path d="M0 0 88-44 176 0 88 44Z" stroke-opacity=".7"/><path d="M88-44v88M0 0h176" stroke-opacity=".35"/><circle r="12" fill="#0e7490"/><circle cx="-48" cy="-24" r="18"/><circle cx="48" cy="-24" r="18"/><circle cx="48" cy="24" r="18"/><circle cx="-48" cy="24" r="18"/><path d="M-48-24 0 0 48-24M-48 24 0 0 48 24"/></g><g transform="translate(670 107)" font-family="Inter,Segoe UI,Arial"><text x="0" y="25" fill="#67e8f9" font-size="12" letter-spacing="2">LIVE WEBGL SCENE</text><text x="0" y="65" fill="#e2e8f0" font-size="18" font-weight="600">AMR fleet coordination</text><text x="0" y="94" fill="#94a3b8" font-size="14">Isometric geometry · orbit controls</text><text x="0" y="116" fill="#94a3b8" font-size="14">Responsive canvas · 2 interactive models</text><rect x="0" y="138" width="166" height="34" rx="17" fill="url(#cyan)"/><text x="21" y="160" fill="#07111f" font-size="13" font-weight="700">OPEN THE 3D LAB ↗</text></g><circle cx="1040" cy="38" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle></svg>
